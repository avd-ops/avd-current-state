name: Release local collector

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SemVer tag and main ancestry (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "RESULT FAIL $TAG is not SemVer"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "RESULT FAIL $TAG is not an ancestor of origin/main"; exit 1; }
          echo "RESULT PASS $TAG is a valid SemVer tag on origin/main"

      - name: Assemble standalone avd_current_state_local.ps1
        shell: pwsh
        run: |
          $res = & ./scripts/Build-AvdLocalRelease.ps1 -OutputPath dist/avd_current_state_local.ps1
          Write-Host "Built $($res.OutputPath) ($($res.Sha256))"

      - name: Run local collector and assembly tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests/LocalCollector.Tests.ps1 -CI

      - name: Sign with Azure Artifact Signing (when enabled)
        if: ${{ vars.ARTIFACT_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1
        with:
          command: sign
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: avd_current_state_local.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Refresh SHA-256 after signing
        if: ${{ vars.ARTIFACT_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist/avd_current_state_local.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  avd_current_state_local.ps1" | Set-Content -LiteralPath dist/avd_current_state_local.ps1.sha256 -Encoding ASCII

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/avd_current_state_local.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avd-current-state-local
          path: |
            dist/avd_current_state_local.ps1
            dist/avd_current_state_local.ps1.sha256

      - name: Publish GitHub Release on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$TAG" --jq '.body' > release-notes.md
          if grep -qiE '([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|ghp_|gho_|github_pat_|AKIA)' release-notes.md; then
            echo "RESULT FAIL release notes matched leak pattern"
            exit 1
          fi
          gh release create "$TAG" dist/avd_current_state_local.ps1 dist/avd_current_state_local.ps1.sha256 --draft --verify-tag --title "$TAG" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false
