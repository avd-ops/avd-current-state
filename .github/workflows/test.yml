name: test

# Offline checks on every PR and on main: script analysis and Pester tests for the facts
# snapshot (contract C11) and the collector's Resource Graph helpers (lib/). Read-only; nothing here calls Azure.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    name: Facts snapshot analysis + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path ./avd_current_state_facts.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
          Invoke-ScriptAnalyzer -Path ./avd_current_state_drift.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
          Invoke-ScriptAnalyzer -Path ./avd_ops_reader.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
          Invoke-ScriptAnalyzer -Path ./lib -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
          # The collector and validator: parse errors and platform compatibility only, for now.
          foreach ($p in './avd_current_state_collector.ps1', './avd_deployment_validator.ps1') {
            Invoke-ScriptAnalyzer -Path $p -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit `
              -IncludeRule PSUseCompatibleSyntax, PSUseCompatibleCommands, PSUseCompatibleTypes
          }

      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI -Output Detailed

  # Runs anywhere (avd-ops docs/run-anywhere.md): the same Pester suite on the desktop systems people
  # run the scripts on. Windows PowerShell 5.1 gets a load check: every script and module parses and
  # its parameters bind, because the test suite itself needs PowerShell 7.
  other-os:
    name: Tests on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows (PowerShell 7), os: windows-latest, shell: pwsh }
          - { name: macOS (PowerShell 7), os: macos-latest, shell: pwsh }
          - { name: Windows PowerShell 5.1, os: windows-latest, shell: powershell }
    steps:
      - uses: actions/checkout@v4

      - name: Pester
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: Load every script and module
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $failed = 0
          foreach ($f in @(Get-ChildItem -Path . -Filter *.ps1 -File) + @(Get-ChildItem -Path ./lib -Filter *.psm1 -File)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed++; Write-Host "::error file=$($f.Name)::$($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"; continue }
            if ($f.Extension -eq '.psm1') { Import-Module $f.FullName -Force -ErrorAction Stop } else { $null = Get-Command $f.FullName -Syntax -ErrorAction Stop }
            Write-Host "loads: $($f.Name)"
          }
          if ($failed) { throw "$failed file(s) don't parse in Windows PowerShell 5.1." }

  portal:
    name: Assessment portal engine + page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine and page tests
        run: node --test "tests/portal/*.test.mjs"

      # The engine's intake.json fixture must be avd-assess's C19 example, byte for byte, and valid against
      # the C19 schema at the pinned avd-assess commit (the foundation contracts live there, brain decision 0021).
      - name: intake.json matches avd-assess contract C19
        env:
          ASSESS_COMMIT: 09bc9c449494db639ad083eaea6dd7d215250e52
        run: |
          pip install --quiet jsonschema
          base="https://raw.githubusercontent.com/avd-ops/avd-assess/$ASSESS_COMMIT/contracts"
          curl -fsSL "$base/schemas/intake.schema.json" -o /tmp/intake.schema.json
          curl -fsSL "$base/examples/assess/intake.example.json" -o /tmp/intake.example.json
          cmp /tmp/intake.example.json tests/portal/fixtures/intake.json
          python3 -c "import json,jsonschema; jsonschema.Draft202012Validator(json.load(open('/tmp/intake.schema.json'))).validate(json.load(open('tests/portal/fixtures/intake.json'))); print('intake.json is valid avd-intake/v1')"

      # The Review stage reads an assessment report (C21) and writes review.json (C23). The engine's
      # assessment.json fixture is avd-assess's C21 example byte for byte; review.json is the engine's
      # own output and must be valid C23.
      - name: Review fixtures match avd-assess contracts C21 and C23
        env:
          ASSESS_COMMIT: 99ee1741e2b7c076735f59ee8ef3a0ddc1bd64b9
        run: |
          pip install --quiet jsonschema
          base="https://raw.githubusercontent.com/avd-ops/avd-assess/$ASSESS_COMMIT/contracts"
          curl -fsSL "$base/schemas/assessment.schema.json" -o /tmp/assessment.schema.json
          curl -fsSL "$base/schemas/assessment-review.schema.json" -o /tmp/review.schema.json
          curl -fsSL "$base/examples/assess/assessment.example.json" -o /tmp/assessment.example.json
          cmp /tmp/assessment.example.json tests/portal/fixtures/assessment.json
          python3 - <<'PY'
          import json, jsonschema
          def check(schema, path, name):
              jsonschema.Draft202012Validator(json.load(open(schema))).validate(json.load(open(path)))
              print(f'{path} is valid {name}')
          check('/tmp/assessment.schema.json', 'tests/portal/fixtures/assessment.json', 'avd-assessment/v1')
          check('/tmp/assessment.schema.json', 'tests/portal/fixtures/assessment-wide.json', 'avd-assessment/v1')
          check('/tmp/review.schema.json', 'tests/portal/fixtures/review.json', 'avd-assessment-review/v1')
          PY

      # The Plan stage writes plan.json (C24) from a report, its review and the pinned method's hints. The
      # engine's fixtures (a report on the method's own checks, its review and the plan) must be valid, against
      # the schemas at the avd-assess commit the method is pinned to (assess/PINS.json).
      - name: Plan fixtures match avd-assess contracts C21, C23 and C24
        env:
          ASSESS_COMMIT: a5f4df1564178e84bc3c52fec123c0c3db59d395
        run: |
          pip install --quiet jsonschema
          base="https://raw.githubusercontent.com/avd-ops/avd-assess/$ASSESS_COMMIT/contracts/schemas"
          curl -fsSL "$base/assessment.schema.json" -o /tmp/assessment.schema.json
          curl -fsSL "$base/assessment-review.schema.json" -o /tmp/review.schema.json
          curl -fsSL "$base/remediation-plan.schema.json" -o /tmp/plan.schema.json
          python3 - <<'PY'
          import json, jsonschema
          for schema, path in [('/tmp/assessment.schema.json', 'tests/portal/fixtures/assessment-method.json'),
                               ('/tmp/review.schema.json', 'tests/portal/fixtures/review-method.json'),
                               ('/tmp/plan.schema.json', 'tests/portal/fixtures/plan.json')]:
              jsonschema.Draft202012Validator(json.load(open(schema))).validate(json.load(open(path)))
              print(f'{path} is valid')
          PY

  lz-parameters:
    name: Landing zone parameter list matches its pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rebuild/lz-parameters.json must list exactly the parameters of avd-landing-zone's main.bicep at
      # the pinned commit (docs/rebuild-fidelity-spec.md, section 9). A newer landing zone only warns:
      # moving the pin is a change of its own, with the rebuild map rules that go with it.
      - name: Compare with the pinned main.bicep
        shell: pwsh
        run: |
          $list = Get-Content -Raw ./rebuild/lz-parameters.json | ConvertFrom-Json
          $scope = Get-Content -Raw ./rebuild/scope.json | ConvertFrom-Json
          if ($list.landingZoneCommit -ne $scope.landingZoneCommit) { throw "lz-parameters.json pins $($list.landingZoneCommit), scope.json pins $($scope.landingZoneCommit)." }
          function Get-BicepParameterName([string]$Ref) {
            $text = (Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/avd-ops/avd-landing-zone/$Ref/bicep/main.bicep").Content
            [regex]::Matches($text, '(?m)^param\s+(\w+)\s') | ForEach-Object { $_.Groups[1].Value }
          }
          $ours = @($list.parameters | ForEach-Object { $_.name })
          $pinned = @(Get-BicepParameterName $list.landingZoneCommit)
          $diff = @(Compare-Object $pinned $ours)
          if ($diff.Count) {
            $diff | ForEach-Object { Write-Host "$(if ($_.SideIndicator -eq '<=') { 'missing from lz-parameters.json' } else { 'not in the pinned main.bicep' }): $($_.InputObject)" }
            throw 'rebuild/lz-parameters.json does not match the pinned landing zone.'
          }
          Write-Host "All $($ours.Count) parameters match the pinned commit."
          $latest = @(Get-BicepParameterName 'master')
          $drift = @(Compare-Object $pinned $latest)
          if ($drift.Count) { Write-Host "::warning::The landing zone's master has $($drift.Count) parameter change(s) since the pin: $(($drift | ForEach-Object { $_.InputObject }) -join ', ')." }
