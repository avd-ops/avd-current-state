# Sample workflow for YOUR PRIVATE repo, not this one: a weekly avd-current-state collection as the optional
# avd-ops-reader, with nobody signed in (docs/reader-identity.md). Copy it to .github/workflows/ there.
#
# Personal project, not for production use. Provided as is, without warranty of any kind (MIT License).
# Not affiliated with the author's employer, with Liquidware or with Microsoft.
#
# Before the first run (the setup script prints these too):
#   - Repository variables AVD_READER_CLIENT_ID, AVD_TENANT_ID, AVD_SUBSCRIPTION_ID, and AVD_OUTPUT_ACCOUNT and
#     AVD_OUTPUT_CONTAINER for the container you gave -OutputContainer. Variables, not secrets: none of them is one.
#   - An environment named avd-reader that only the main branch may deploy to.
#   - A ruleset protecting .github/workflows/**: whoever can change a workflow can get the reader's token.
#   - Immutable OIDC subjects turned on, for a repo created before 2026-07-15.
#   - The shortest log retention you can live with: the collector's log names your resources.
name: avd-current-state collection

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays, 05:17 UTC
  workflow_dispatch:        # never pull_request or pull_request_target: they would reach the reader's token

permissions:
  id-token: write   # the federated sign-in
  contents: read

concurrency:
  group: avd-ops-reader
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: avd-reader
    timeout-minutes: 60
    steps:
      - name: Mask the IDs in the log
        run: |
          echo "::add-mask::${{ vars.AVD_TENANT_ID }}"
          echo "::add-mask::${{ vars.AVD_SUBSCRIPTION_ID }}"
          echo "::add-mask::${{ vars.AVD_READER_CLIENT_ID }}"

      # Third-party actions pinned by commit, not by tag.
      - name: Check out avd-current-state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: avd-ops/avd-current-state
          ref: main   # better: a commit you reviewed
          path: avd-current-state
          persist-credentials: false

      - name: Sign in as avd-ops-reader (federated, no secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ vars.AVD_READER_CLIENT_ID }}
          tenant-id: ${{ vars.AVD_TENANT_ID }}
          subscription-id: ${{ vars.AVD_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Use the runner's Az modules, install nothing
        shell: pwsh
        run: |
          foreach ($m in 'Az.Accounts', 'Az.Resources') {
            $v = Get-Module -ListAvailable -Name $m | Sort-Object Version -Descending | Select-Object -First 1
            if (-not $v) { throw "$m is missing from the runner image; pin and install it here (Install-Module -RequiredVersion) rather than let the collector install the latest." }
            Write-Host "$m $($v.Version)"
          }

      - name: Check the reader holds nothing more than it should
        shell: pwsh
        working-directory: avd-current-state
        env:
          AVD_READER_CLIENT_ID: ${{ vars.AVD_READER_CLIENT_ID }}
        run: ./avd_ops_reader.ps1 -Mode Test

      - name: Collect
        shell: pwsh
        working-directory: avd-current-state
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'avd-collect'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./avd_current_state_collector.ps1 -OutputPath $out

      - name: Upload the package to your container (never an Actions artifact)
        run: |
          az storage blob upload-batch --auth-mode login \
            --account-name "${{ vars.AVD_OUTPUT_ACCOUNT }}" --destination "${{ vars.AVD_OUTPUT_CONTAINER }}" \
            --destination-path "$(date -u +%Y-%m-%d)" --source "$RUNNER_TEMP/avd-collect" --pattern '*.zip' --only-show-errors

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/avd-collect"
